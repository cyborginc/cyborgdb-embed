# Watches the upstream projects whose versions are pinned here and opens a pull
# request when one moves.
#
# An ONNX Runtime pull request also starts a release-artifacts.yml run on its
# branch. That run publishes only once someone approves the release environment,
# then commits the digests to the branch, so the PR is mergeable as it stands.
#
# A tokenizers pull request only bumps the pin: push its tag by hand once the
# parity suite has run, since a tokenizers release can change tokenisation and
# move every vector.
name: check-upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  onnxruntime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # An open PR may already carry published digests, and regenerating its
      # branch would drop them.
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=v$(./scripts/version.py onnxruntime)
          latest=$(gh release list --repo microsoft/onnxruntime --limit 20 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName')
          open=$(gh pr list --head "ort-$latest" --state open --json number --jq length)
          echo "current=$current latest=$latest open=$open"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          [ "$latest" != "$current" ] && [ "$open" = 0 ] && bump=true || bump=false
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - if: steps.versions.outputs.bump == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("versions.json")
          d = json.loads(p.read_text())
          d["onnxruntime"] = {"version": "${{ steps.versions.outputs.latest }}".lstrip("v"),
                              "build": 1}
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - if: steps.versions.outputs.bump == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ort-${{ steps.versions.outputs.latest }}
          title: "Pin ONNX Runtime ${{ steps.versions.outputs.latest }}"
          body: |
            ONNX Runtime moved from ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}.

            A `release-artifacts` run has started on this branch. It builds and verifies the archives, then waits for approval of the `release` environment. Once approved, it publishes them and commits their digests here. Merge after that commit lands and CI passes.

            Before approving: the build flags are load-bearing and have broken on version changes before — `--disable_contrib_ops` breaks linux/arm64, and symbol isolation has to keep working on both object formats.
          add-paths: versions.json

      - if: steps.pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-artifacts.yml --ref "ort-${{ steps.versions.outputs.latest }}" \
            -f component=onnxruntime -f publish=true

  tokenizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          current=$(./scripts/version.py tokenizers)
          latest=$(curl -sS -H "User-Agent: cyborgdb-embed" \
            https://crates.io/api/v1/crates/tokenizers \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_stable_version"])')
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - if: steps.versions.outputs.latest != steps.versions.outputs.current
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("versions.json")
          d = json.loads(p.read_text())
          d["tokenizers"] = {"version": "${{ steps.versions.outputs.latest }}", "build": 1}
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          ./scripts/build_tokenizer.sh --sync-only 2>/dev/null || true

      - if: steps.versions.outputs.latest != steps.versions.outputs.current
        uses: peter-evans/create-pull-request@v6
        with:
          branch: tokenizers-${{ steps.versions.outputs.latest }}
          title: "Pin tokenizers ${{ steps.versions.outputs.latest }}"
          body: |
            tokenizers moved from ${{ steps.versions.outputs.current }} to
            ${{ steps.versions.outputs.latest }}.

            This only changes the pin. Nothing is published until a
            `tokenizers-<version>-<build>` tag is pushed.

            **Run the parity suite before releasing.** A tokenizers release can
            change tokenisation, and that moves every vector — the symbol checks
            in the release workflow cannot see it.
          add-paths: |
            versions.json
            tokenizer/Cargo.toml
