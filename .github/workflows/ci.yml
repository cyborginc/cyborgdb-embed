# Per-change gate: the library builds, its symbol surface is clean, and its
# vectors still match sentence-transformers.
#
# ONNX Runtime and the tokenizer are published as prebuilt archives under their
# own release tags, so nothing here builds them. scripts/build_ort.sh and
# scripts/build_tokenizer.sh regenerate them when a version is bumped.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Declared at the top level so a new job
# starts read-only rather than inheriting whatever the default happens to be.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: ./scripts/ci_apt.sh libcurl4-openssl-dev libssl-dev zlib1g-dev

      # Model files are downloaded on first use and keyed by pinned revision, so
      # a re-pin invalidates rather than serving stale weights.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cyborgdb-embed
          key: models-${{ hashFiles('registry.yaml') }}

      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j

      - if: runner.os == 'macOS'
        name: archives need no newer macOS than the deployment target
        run: ./scripts/check_minos.sh .artifacts/*/lib*-darwin-arm64.a

      - name: golden vectors
        run: ctest --test-dir build --output-on-failure

      # Almost all of this is ONNX Runtime, so it moves when its build flags do.
      - name: consumer footprint
        run: ./scripts/check_size.sh build/size_probe

  # A wheel links in a manylinux_2_28 image, against glibc 2.28 and that system's
  # libstdc++. Linking the published archives there is what proves a wheel can.
  manylinux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: links under manylinux_2_28
        run: |
          ./scripts/in_manylinux.sh bash -c '
            set -e
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target size_probe -j
            ./scripts/check_glibc.sh build/size_probe'

  symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci_apt.sh libcurl4-openssl-dev libssl-dev zlib1g-dev

      # Audits the published archives rather than locally built ones, so what is
      # checked is what a consumer actually downloads. Only the ELF archives:
      # nm reads one object format, and the Mach-O archives are checked on a
      # macOS runner when they are built.
      - name: fetch published archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/audit
          for component in onnxruntime tokenizers; do
            gh release download "$(python3 scripts/version.py "$component" --tag)" \
              --dir .artifacts/audit --pattern 'lib*-linux-*.a' --clobber
          done
          # Guards every check below: an unmatched glob would otherwise leave
          # them inspecting nothing and passing.
          found=$(find .artifacts/audit -name 'lib*.a' | wc -l)
          [ "$found" -eq 4 ] || { echo "expected 4 archives, downloaded $found"; exit 1; }
          ls -l .artifacts/audit

      # Rebuilds what the consuming project vendors, at its pins, so the audit
      # reflects a real link rather than a guess.
      - run: ./scripts/build_core_deps.sh

      # ELF keeps hidden symbols global for static-archive resolution, so this is
      # not something a macOS run can vouch for: the same archives collide on
      # 1,748 strong symbols here and none on Darwin.
      # Strong overlap must be zero. Weak overlap is expected and safe: those are
      # identical COMDAT definitions the linker is designed to fold.
      - name: onnxruntime does not collide with a consuming project
        run: |
          mapfile -t deps < <(find .ort/core-deps/lib -name '*.a' | sort -u)
          python3 scripts/symbol_diff.py \
            --a .artifacts/audit/libonnxruntime-linux-amd64.a \
            --b "${deps[@]}" --label-a onnxruntime --label-b core-deps | tee /tmp/overlap.txt
          if grep -qE '^[a-z]+ +[0-9]+ +[1-9]' /tmp/overlap.txt; then
            echo "strong symbol collisions with a consuming project"; exit 1
          fi

      # Strong exports only. Weak symbols are COMDAT template and inline
      # instantiations that deduplicate safely against a consumer's identical
      # copies; localizing them discards their groups and breaks the link.
      - name: vendored archives export only their public API
        run: |
          check() {
            local found count
            found=$(nm -g --defined-only "$1" | awk '$2 ~ /^[TDBR]$/ {print $3}' | sort -u)
            count=$(printf '%s' "$found" | grep -c . || true)
            echo "$1: $count strong [$(echo "$found" | tr '\n' ' ')]"
            # A zero is as wrong as an overrun: it means nothing was read.
            if [ "$count" -lt 1 ] || [ "$count" -gt "$2" ]; then
              echo "expected 1..$2 strong symbols, found $count"; exit 1
            fi
          }
          for a in .artifacts/audit/libonnxruntime-linux-*.a; do check "$a" 2; done
          for a in .artifacts/audit/libtokenizer-linux-*.a; do check "$a" 3; done

      # Hand-written assembly without a .note.GNU-stack marker makes the linker
      # mark the stack executable, and consumers inherit it.
      - name: archives do not require an executable stack
        run: |
          for a in .artifacts/audit/lib*-linux-*.a; do
            if readelf -lW "$a" 2>/dev/null | grep -q 'GNU_STACK.*RWE'; then
              echo "$a requires an executable stack"; exit 1
            fi
          done
          echo "ok"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci_apt.sh libcurl4-openssl-dev libssl-dev zlib1g-dev lcov

      # The golden test needs a model, and without it the inference path reads
      # as uncovered. Cached by pinned revision, so a re-pin refetches.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cyborgdb-embed
          key: models-${{ hashFiles('registry.yaml') }}

      - run: ./scripts/coverage.sh
        env:
          CYBORGDB_EMBED_CACHE: ~/.cache/cyborgdb-embed

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r scripts/requirements.txt

      # The generated header must match the registry it came from, and every
      # model must be pinned. A model without a parity verdict does not ship.
      - name: registry is generated and pinned
        run: |
          python3 scripts/gen_registry.py
          git diff --exit-code src/registry_generated.hpp \
            || { echo "src/registry_generated.hpp is stale; regenerate it"; exit 1; }
          python3 scripts/gen_registry.py --strict
