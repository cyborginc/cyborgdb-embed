# Builds and publishes the prebuilt archives for one component.
#
# Each component has its own tag series named for the upstream version plus a
# build number, so a build-flag fix can reissue an archive without the upstream
# version moving, and an ONNX Runtime bump does not republish the tokenizer.
#
#   ort-1.30.0-1          ONNX Runtime 1.30.0, first build
#   tokenizers-0.23.2-1   tokenizers 0.23.2, first build
#
# A manual run builds candidates and verifies them. parity.yml takes that run's
# id to score the candidates. With `publish`, a manual run on a branch also
# publishes one component under the tag versions.json names, then commits the
# digests to that branch, so a pin-bump pull request merges with a pin that builds.
name: release-artifacts

on:
  push:
    tags:
      - "ort-*"
      - "tokenizers-*"
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [both, onnxruntime, tokenizers]
        default: both
      publish:
        description: Publish after verifying, and commit the digests to this branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.pick.outputs.components }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ github.ref_type }}/${{ github.ref_name }}" in
            tag/ort-*)        components='["onnxruntime"]' ;;
            tag/tokenizers-*) components='["tokenizers"]' ;;
            *)
              case "${{ inputs.component }}" in
                onnxruntime|tokenizers) components='["${{ inputs.component }}"]' ;;
                *)
                  [ "${{ inputs.publish }}" != true ] || { echo "publish takes one component"; exit 1; }
                  components='["onnxruntime", "tokenizers"]' ;;
              esac ;;
          esac
          echo "components=$components" >> "$GITHUB_OUTPUT"

          # Checked here rather than at publish, which comes hours later and after approval.
          if [ "${{ inputs.publish }}" = true ]; then
            tag=$(./scripts/version.py ${{ inputs.component }} --tag)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already published; bump the build number in versions.json"
              exit 1
            fi
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.plan.outputs.components) }}
        platform: [linux-amd64, linux-arm64, darwin-arm64]
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The Linux builds run in the manylinux image, which carries its own Rust.
      - if: matrix.component == 'tokenizers' && runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      # The tag names a version but does not select one: versions.json decides
      # what is fetched and built, so a local build produces the same archive as
      # a release. The tag must therefore agree with it.
      - name: tag matches versions.json
        if: github.ref_type == 'tag'
        run: |
          tag="${{ github.ref_name }}"
          expected=$(./scripts/version.py ${{ matrix.component }} --tag)
          echo "tag $tag, versions.json $expected"
          [ "$tag" = "$expected" ] || {
            echo "tag disagrees with versions.json; bump the build number there or retag"
            exit 1; }

      - name: build
        env:
          ORT_PLATFORM: ${{ matrix.platform }}
          TOKENIZER_PLATFORM: ${{ matrix.platform }}
        run: |
          platform=${{ matrix.platform }}
          if [ "${{ matrix.component }}" = onnxruntime ]; then
            build=(./scripts/build_ort.sh all)
            built=onnxruntime/prebuilt/$platform/libonnxruntime.a
            name=libonnxruntime-$platform.a
          else
            build=(./scripts/build_tokenizer.sh all)
            built=tokenizer/prebuilt/$platform/libcyborgdb_tokenizer.a
            name=libtokenizer-$platform.a
          fi
          [ "$RUNNER_OS" = Linux ] && build=(./scripts/in_manylinux.sh "${build[@]}")
          "${build[@]}"
          mv "$built" "$name"

      # The archive must export its public entry points and nothing more. Weak
      # symbols are COMDAT instantiations that deduplicate safely; the strong
      # ones are what would collide in a consumer's link.
      - name: strong exports only
        run: |
          archive=$(ls lib*-${{ matrix.platform }}.a)
          found=$(./scripts/exported_symbols.sh "$archive")
          echo "$archive: $(echo "$found" | tr '\n' ' ')"
          limit=3; [ "${{ matrix.component }}" = onnxruntime ] && limit=2
          [ "$(echo "$found" | wc -l)" -le "$limit" ] || { echo "leaks strong symbols"; exit 1; }

      - if: runner.os == 'Linux'
        name: no executable stack
        run: |
          archive=$(ls lib*-${{ matrix.platform }}.a)
          readelf -lW "$archive" 2>/dev/null | grep -q 'GNU_STACK.*RWE' \
            && { echo "$archive requires an executable stack"; exit 1; }
          echo ok

      - if: runner.os == 'macOS'
        name: no newer macOS than the deployment target
        run: ./scripts/check_minos.sh lib*-${{ matrix.platform }}.a

      - run: shasum -a 256 lib*-${{ matrix.platform }}.a | tee digest-${{ matrix.platform }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.component }}-${{ matrix.platform }}
          path: |
            lib*-${{ matrix.platform }}.a
            digest-${{ matrix.platform }}.txt

  # Links the candidates the way a consumer would and runs the golden vectors,
  # before anything is tagged. Linux links inside the manylinux image, since that
  # is where a wheel's link happens and where a too-new glibc symbol fails.
  verify:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-${{ matrix.platform }}
          merge-multiple: true
          path: candidate
      - run: ./scripts/seed_candidates.sh candidate

      - name: golden vectors, footprint and glibc symbols
        if: runner.os == 'Linux'
        run: |
          ./scripts/in_manylinux.sh bash -c '
            set -e
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./scripts/check_size.sh build/size_probe
            ./scripts/check_glibc.sh build/size_probe'

      - name: golden vectors and footprint
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          ./scripts/check_size.sh build/size_probe

      # conda-forge's ld64 predates Xcode 15's linker and is stricter: it
      # resolves an unwind table's reference to a personality routine only against
      # a non-local symbol. Wheels built with a conda toolchain link with it.
      - if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ld64
          create-args: -c conda-forge ld64=956.6
          cache-environment: true
      - if: runner.os == 'macOS'
        name: links with conda-forge's ld64
        run: |
          cmake -S . -B build-ld64 -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_EXE_LINKER_FLAGS=--ld-path=$MAMBA_ROOT_PREFIX/envs/ld64/bin/ld"
          cmake --build build-ld64 --target size_probe -j

  publish:
    needs: [build, verify]
    # verify runs only on manual runs, so a tag push publishes once build passes.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (github.ref_type == 'tag' || (inputs.publish && needs.verify.result == 'success')) }}
    # Gated on the release environment. The build runs unattended so its checks
    # and digests are on screen before anyone approves; only making the archives
    # public needs a decision.
    environment: release
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"
          else
            tag=$(./scripts/version.py ${{ inputs.component }} --tag)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: digests for cmake/artifacts.cmake
        run: |
          {
            echo '## Paste into `CYBORGDB_EMBED_ARTIFACT_DIGESTS`'
            echo '```cmake'
            for f in dist/digest-*.txt; do
              while read -r sum path; do
                name=$(basename "$path" .a | sed 's/^lib//')
                printf '  "%s  %s"\n' "$name" "$sum"
              done < "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      # On a manual run this creates the tag at the commit that was built.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/lib*.a
          fail_on_unmatched_files: true
          # These are build inputs, not versions of the library. Leaving them
          # eligible makes whichever archive was published most recently the
          # repository's headline release.
          make_latest: false
          body: |
            Prebuilt static archives for `${{ steps.tag.outputs.tag }}`.

      # A push made with the workflow token does not trigger pull_request, so
      # CI is dispatched explicitly for the new head.
      - name: record digests on ${{ github.ref_name }}
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/record_digests.py dist/digest-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record ${{ steps.tag.outputs.tag }} digests" -- cmake/artifacts.cmake
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
          gh workflow run ci.yml --ref "${{ github.ref_name }}"

  # A run started by check-upstream.yml has no person to notify, so a failure is
  # reported on the branch's pull request instead.
  report-failure:
    needs: [plan, build, verify, publish]
    if: failure() && inputs.publish
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --body "release-artifacts failed or was rejected: $run_url" \
            || echo "no pull request for ${{ github.ref_name }}"
