# Builds and publishes the prebuilt archives for one component.
#
# Each component has its own tag series named for the upstream version plus a
# build number, so a build-flag fix can reissue an archive without the upstream
# version moving, and an ONNX Runtime bump does not republish the tokenizer.
#
#   ort-1.30.0-1          ONNX Runtime 1.30.0, first build
#   tokenizers-0.23.2-1   tokenizers 0.23.2, first build
name: release-artifacts

on:
  push:
    tags:
      - "ort-*"
      - "tokenizers-*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - if: startsWith(github.ref_name, 'tokenizers-')
        uses: dtolnay/rust-toolchain@stable

      - if: runner.os == 'Linux'
        run: ./scripts/ci_apt.sh libcurl4-openssl-dev libssl-dev zlib1g-dev

      # The tag names a version but does not select one: versions.json decides
      # what is fetched and built, so a local build produces the same archive as
      # a release. The tag must therefore agree with it.
      - name: tag matches versions.json
        run: |
          tag="${{ github.ref_name }}"
          case "$tag" in
            ort-*) expected=$(./scripts/version.py onnxruntime --tag) ;;
            *)     expected=$(./scripts/version.py tokenizers --tag) ;;
          esac
          echo "tag $tag, versions.json $expected"
          [ "$tag" = "$expected" ] || {
            echo "tag disagrees with versions.json; bump the build number there or retag"
            exit 1; }

      - name: build
        run: |
          if [[ "${{ github.ref_name }}" == ort-* ]]; then
            ORT_PLATFORM=${{ matrix.platform }} ./scripts/build_ort.sh all
            mv onnxruntime/prebuilt/${{ matrix.platform }}/libonnxruntime.a \
               libonnxruntime-${{ matrix.platform }}.a
          else
            TOKENIZER_PLATFORM=${{ matrix.platform }} ./scripts/build_tokenizer.sh all
            mv tokenizer/prebuilt/${{ matrix.platform }}/libcyborgdb_tokenizer.a \
               libtokenizer-${{ matrix.platform }}.a
          fi

      # The archive must export its public entry points and nothing more. Weak
      # symbols are COMDAT instantiations that deduplicate safely; the strong
      # ones are what would collide in a consumer's link.
      - name: strong exports only
        run: |
          archive=$(ls lib*-${{ matrix.platform }}.a)
          found=$(nm -g --defined-only "$archive" 2>/dev/null \
            | awk '$2 ~ /^[TDBR]$/ {print $3}' | sed 's/^_//' | sort -u)
          echo "$archive: $(echo "$found" | tr '\n' ' ')"
          limit=3; [[ "${{ github.ref_name }}" == ort-* ]] && limit=2
          [ "$(echo "$found" | wc -l)" -le "$limit" ] || { echo "leaks strong symbols"; exit 1; }

      - if: runner.os == 'Linux'
        name: no executable stack
        run: |
          archive=$(ls lib*-${{ matrix.platform }}.a)
          readelf -lW "$archive" 2>/dev/null | grep -q 'GNU_STACK.*RWE' \
            && { echo "$archive requires an executable stack"; exit 1; }
          echo ok

      - run: shasum -a 256 lib*-${{ matrix.platform }}.a | tee digest-${{ matrix.platform }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: |
            lib*-${{ matrix.platform }}.a
            digest-${{ matrix.platform }}.txt

  publish:
    needs: build
    # Gated on the release environment. The build runs unattended so its checks
    # and digests are on screen before anyone approves; only making the archives
    # public needs a decision.
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true

      # Printed in the form the pin file expects, because the digests cannot
      # exist before the archives are built and have to be recorded by hand.
      - name: digests for cmake/artifacts.cmake
        run: |
          {
            echo '## Paste into `CYBORGDB_EMBED_ARTIFACT_DIGESTS`'
            echo '```cmake'
            for f in digest-*.txt; do
              while read -r sum path; do
                name=$(basename "$path" .a | sed 's/^lib//')
                printf '  "%s  %s"\n' "$name" "$sum"
              done < "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          files: lib*.a
          fail_on_unmatched_files: true
          # These are build inputs, not versions of the library. Leaving them
          # eligible makes whichever archive was published most recently the
          # repository's headline release.
          make_latest: false
          body: |
            Prebuilt static archives for `${{ github.ref_name }}`.
