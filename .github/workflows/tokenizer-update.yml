# Watches for tokenizers releases, rebuilds the vendored archives, and opens a PR.
# Cargo runs only here: consumers link the committed archives.
name: tokenizer-update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Version to pin instead of the newest release
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.versions.outputs.current }}
      latest: ${{ steps.versions.outputs.latest }}
      changed: ${{ steps.versions.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          current=$(grep -oE 'tokenizers = \{ version = "[^"]+"' tokenizer/Cargo.toml | grep -oE '[0-9]+\.[0-9]+')
          latest="${{ inputs.version }}"
          if [ -z "$latest" ]; then
            latest=$(curl -sS https://crates.io/api/v1/crates/tokenizers \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_stable_version"])')
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          [ "$current" = "${latest%.*}" ] && echo "changed=false" >> "$GITHUB_OUTPUT" \
                                          || echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sed -i.bak -E 's/(tokenizers = \{ version = ")[^"]+/\1${{ needs.check.outputs.latest }}/' tokenizer/Cargo.toml
          rm -f tokenizer/Cargo.toml.bak
      - run: TOKENIZER_PLATFORM=${{ matrix.platform }} ./scripts/build_tokenizer.sh all

      # The archive must export the C API and nothing else. Anything more means
      # the Rust runtime reaches a consumer's link.
      - name: verify exported surface
        run: |
          A=tokenizer/prebuilt/${{ matrix.platform }}/libcyborgdb_tokenizer.a
          if [ "$RUNNER_OS" = "macOS" ]; then
            found=$(nm -m "$A" | grep " external " | grep -v "non-external\|private external\|(undefined)" | awk '{print $NF}' | sort -u)
          else
            found=$(nm -g --defined-only "$A" | awk '$2 ~ /^[TDBRWV]$/ {print $3}' | sort -u)
          fi
          echo "$found"
          [ "$(echo "$found" | wc -l)" -eq 3 ] || { echo "expected 3 exported symbols"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: tokenizer-${{ matrix.platform }}
          path: tokenizer/prebuilt/${{ matrix.platform }}/

  propose:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tokenizer-*
          path: tokenizer/prebuilt/
      - run: |
          sed -i -E 's/(tokenizers = \{ version = ")[^"]+/\1${{ needs.check.outputs.latest }}/' tokenizer/Cargo.toml
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: tokenizer-${{ needs.check.outputs.latest }}
          title: "Update tokenizers to ${{ needs.check.outputs.latest }}"
          body: |
            Rebuilds the vendored tokenizer archives against tokenizers
            ${{ needs.check.outputs.latest }} (was ${{ needs.check.outputs.current }}).

            Each archive was checked to export only the three C API symbols.
            Tokenizer output is not verified here — run the parity suite before
            merging, since a tokenization change moves every vector.
          add-paths: |
            tokenizer/Cargo.toml
            tokenizer/prebuilt/
