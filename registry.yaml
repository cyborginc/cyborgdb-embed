# Supported models. src/registry_generated.hpp is produced from this file by
# scripts/gen_registry.py; edit here, never there.
#
# revision and onnx_sha256 are populated by the generator against the upstream
# repository. An entry without both is rejected: an unpinned model can change
# underneath a built index and return different vectors with nothing failing.
#
# parity is written by the nightly comparison run. An entry without a verdict
# does not ship.

models:
  - id: sentence-transformers/all-MiniLM-L6-v2
    enum: AllMiniLmL6V2
    revision: ""
    onnx_path: onnx/model.onnx
    onnx_sha256: ""
    dim: 384
    pooling: mean_tokens
    normalize: true
    max_seq_length: 256        # not max_position_embeddings, which is 512
    query_prefix: ""
    doc_prefix: ""
    parity: ""

