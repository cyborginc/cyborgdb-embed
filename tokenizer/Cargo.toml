[package]
name = "cyborgdb_tokenizer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cyborgdb_tokenizer"
crate-type = ["staticlib"]

[dependencies]
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = false
